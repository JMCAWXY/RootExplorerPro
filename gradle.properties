# Root Explorer Pro — Gradle JVM settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX is required by Jetpack Compose.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Use the SDK's aapt2 instead of the Maven-distributed one that AGP downloads into the Gradle
# cache. On this machine that cached copy cannot render its own diagnostics: any resource error
# comes back as "Error 15100 while retrieving message for error 13", which hides the real
# message (and made a missing-resource failure look like a corrupt manifest). The SDK copy is
# the same aapt2 2.20 and reports errors legibly.
android.aapt2FromMavenOverride=H\:\\Android studio SDK\\build-tools\\36.0.0\\aapt2.exe

# Kotlin.
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
